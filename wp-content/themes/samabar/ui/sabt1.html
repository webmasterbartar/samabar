<body class="bg-surface text-on-surface min-h-screen flex flex-col">
<!-- Simplified Header for Transactional Flow -->
<header class="h-16 border-b border-outline-variant bg-surface-container-lowest flex items-center px-margin justify-between shrink-0">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">local_shipping</span>
<span class="font-headline-md text-headline-md font-bold text-primary">Sama Bar</span>
</div>
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-variant text-on-surface-variant transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</header>
<main class="flex-1 w-full max-w-[1280px] mx-auto px-margin py-lg flex flex-col">
<!-- Step Indicator -->
<div class="flex justify-center items-center mb-xl w-full max-w-2xl mx-auto">
<!-- Step 1 (Active) -->
<div class="flex flex-col items-center gap-2 relative z-10">
<div class="w-10 h-10 rounded-full bg-primary text-on-primary flex justify-center items-center font-label-md text-label-md shadow-sm">۱</div>
<span class="font-label-md text-label-md text-primary font-bold">مسیر</span>
</div>
<div class="flex-1 h-[2px] bg-outline-variant mx-4 mt-[-24px]">
<div class="h-full bg-primary w-1/2"></div>
</div>
<!-- Step 2 -->
<div class="flex flex-col items-center gap-2 relative z-10">
<div class="w-10 h-10 rounded-full bg-surface-container-highest text-on-surface border border-outline-variant flex justify-center items-center font-label-md text-label-md">۲</div>
<span class="font-label-md text-label-md text-on-surface-variant">محموله</span>
</div>
<div class="flex-1 h-[2px] bg-outline-variant mx-4 mt-[-24px]"></div>
<!-- Step 3 -->
<div class="flex flex-col items-center gap-2 relative z-10">
<div class="w-10 h-10 rounded-full bg-surface-container-highest text-on-surface border border-outline-variant flex justify-center items-center font-label-md text-label-md">۳</div>
<span class="font-label-md text-label-md text-on-surface-variant">بررسی</span>
</div>
</div>
<!-- Main Content Grid -->
<div class="grid grid-cols-1 lg:grid-cols-12 gap-gutter flex-1">
<!-- Left Side (Inputs) - Takes up more space -->
<div class="lg:col-span-7 flex flex-col gap-md relative">
<!-- Decorative Connecting Line -->
<div class="absolute right-[43px] top-[80px] bottom-[120px] w-[2px] border-r-2 border-dashed border-outline-variant z-0 hidden sm:block"></div>
<!-- Origin Card -->
<div class="bg-surface-container-lowest rounded-xl border border-outline-variant p-md relative z-10 shadow-sm">
<div class="flex items-center gap-3 mb-md">
<div class="w-8 h-8 rounded-full bg-surface-variant flex items-center justify-center border border-outline-variant">
<span class="material-symbols-outlined text-primary text-sm" style="font-variation-settings: 'FILL' 1;">radio_button_checked</span>
</div>
<h2 class="font-headline-md text-headline-md text-on-surface">مبدا بارگیری</h2>
</div>
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface-variant">جستجوی شهر، پایانه یا آدرس دقیق</label>
<div class="relative">
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline">search</span>
<input class="w-full h-14 pr-12 pl-4 border border-outline-variant rounded-lg bg-surface focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none font-body-lg text-body-lg text-on-surface transition-all" placeholder="مثال: تهران، پایانه باربری جنوب..." type="text"/>
</div>
<!-- Quick Select Chips -->
<div class="flex gap-2 mt-2 overflow-x-auto pb-2">
<button class="px-3 py-1.5 rounded-full bg-surface-container-low border border-outline-variant font-label-sm text-label-sm text-on-surface-variant hover:bg-surface-container-highest transition-colors whitespace-nowrap">تهران</button>
<button class="px-3 py-1.5 rounded-full bg-surface-container-low border border-outline-variant font-label-sm text-label-sm text-on-surface-variant hover:bg-surface-container-highest transition-colors whitespace-nowrap">بندرعباس</button>
<button class="px-3 py-1.5 rounded-full bg-surface-container-low border border-outline-variant font-label-sm text-label-sm text-on-surface-variant hover:bg-surface-container-highest transition-colors whitespace-nowrap">اصفهان</button>
</div>
</div>
</div>
<!-- Destination Card -->
<div class="bg-surface-container-lowest rounded-xl border border-outline-variant p-md relative z-10 shadow-sm mt-4">
<div class="flex items-center gap-3 mb-md">
<div class="w-8 h-8 rounded-full bg-error-container/30 flex items-center justify-center border border-secondary/20">
<span class="material-symbols-outlined text-secondary text-sm" style="font-variation-settings: 'FILL' 1;">location_on</span>
</div>
<h2 class="font-headline-md text-headline-md text-on-surface">مقصد تخلیه</h2>
</div>
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface-variant">جستجوی شهر، کارخانه یا آدرس دقیق</label>
<div class="relative">
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline">search</span>
<input class="w-full h-14 pr-12 pl-4 border border-outline-variant rounded-lg bg-surface focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none font-body-lg text-body-lg text-on-surface transition-all" placeholder="مثال: تبریز، شهرک صنعتی شهید سلیمی..." type="text"/>
</div>
</div>
</div>
</div>
<!-- Right Side (Widgets) -->
<div class="lg:col-span-5 flex flex-col gap-md">
<!-- Map Preview Widget -->
<div class="bg-surface-container-lowest rounded-xl border border-outline-variant overflow-hidden h-[240px] relative shadow-sm group">
<img class="w-full h-full object-cover grayscale opacity-60 group-hover:opacity-80 transition-opacity duration-500" data-alt="A highly detailed, stylized digital map interface displayed in a light mode corporate logistics dashboard. The map is rendered in crisp, high-contrast whites and subtle grays, avoiding visual clutter. A precise, vibrant primary blue route line arcs gracefully between two prominent location pins, illustrating a planned cargo journey. The overall aesthetic is professional, clean, and technologically advanced, fitting a modern B2B logistics application." data-location="Iran Route Map" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDK7wSYBKtG6vR3BJ58eaXjm4J4DWYa40tiyl0rWSq_2DnFZAxC9cvwCSYiqV-3KzKx6lzFHG42Eg0Q0aQdiKeKwg5cp6aZTsUgCrObbiysNzWCb6F8spuGVbuVM7jGUaZaY_D7OhxmlL0YAZ_MezbkoLI_urv0osAmodQHKN_z6wka8cVbf8HbPP5jt-7hDRj2aaUIxcyyepbBXBBuauy-_A4HPZwa1kPgnIaJurrJowZObaZ_7S4ZKjdKnxtdov-d6tHsYC0dUOk"/>
<div class="absolute inset-0 bg-gradient-to-t from-surface/80 to-transparent"></div>
<div class="absolute bottom-4 left-0 right-0 flex justify-center">
<div class="bg-surface/90 backdrop-blur-md px-4 py-2 rounded-lg border border-outline-variant font-label-md text-label-md text-on-surface flex items-center gap-2 shadow-sm">
<span class="material-symbols-outlined text-primary text-sm">route</span>
                            مسیر روی نقشه مشخص نشده است
                        </div>
</div>
</div>
<!-- Date Selection (Optional) -->
<div class="bg-surface-container-lowest rounded-xl border border-outline-variant p-md shadow-sm">
<h3 class="font-headline-md text-headline-md text-on-surface mb-md flex items-center gap-2">
<span class="material-symbols-outlined text-outline">calendar_month</span>
                        زمان بارگیری <span class="text-on-surface-variant text-sm font-normal">(اختیاری)</span>
</h3>
<div class="relative">
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline">event</span>
<input class="w-full h-14 pr-12 pl-4 border border-outline-variant rounded-lg bg-surface focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none font-body-md text-body-md text-on-surface cursor-pointer" placeholder="انتخاب روز و ساعت..." readonly="" type="text"/>
</div>
</div>
</div>
</div>
<!-- Sticky Footer Action -->
<div class="mt-auto pt-xl pb-md flex justify-end">
<button class="bg-secondary text-on-secondary px-8 py-3 rounded-lg font-headline-md text-headline-md flex items-center gap-3 hover:bg-secondary/90 transition-colors shadow-sm focus:ring-4 focus:ring-secondary/20">
                تایید و مرحله بعد
                <span class="material-symbols-outlined rtl:-scale-x-100">arrow_forward</span>
</button>
</div>
</main>
</body></html>
